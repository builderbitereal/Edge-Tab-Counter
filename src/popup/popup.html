<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edge Tab Counter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="header">
        <div>
          <p class="eyebrow">BuilderBite</p>
          <h1>Edge Tab Counter</h1>
        </div>
        <button id="refreshButton" class="icon-button" type="button" title="Refresh tab numbers" aria-label="Refresh tab numbers">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 1-15.5 6.2"/>
            <path d="M3 12A9 9 0 0 1 18.5 5.8"/>
            <path d="M18 2v5h5"/>
            <path d="M6 22v-5H1"/>
          </svg>
        </button>
      </header>

      <section class="tabs-section" aria-label="Current window tabs">
        <div class="section-title">
          <h2>Current Window</h2>
          <span id="tabTotal">0 tabs</span>
        </div>
        <ol id="tabList" class="tab-list"></ol>
      </section>

      <p class="note">Supported pages show the number in the tab title. Protected browser pages still show it in the extension icon and badge.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
